[project]
name = "support_system"
version = "0.1.0"
description = "support_system using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=0.134.0,<1.0.0",
    "chromadb>=0.6.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "scikit-learn>=1.3.0",
    "sentence-transformers>=2.2.2",
    "langchain>=0.1.0",
    "langchain-openai>=0.0.6",
    "langchain-community>=0.0.20",
    "openai>=1.0.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "tiktoken>=0.5.0",
    "langchain-mistralai>=0.1.0"
]

[project.scripts]
support_system = "support_system.main:run"
run_crew = "support_system.main:run"
train = "support_system.main:train"
replay = "support_system.main:replay"
test = "support_system.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
